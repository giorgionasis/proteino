<!-- Supabase → Authentication → Email Templates → "Reset Password".
     Subject: Ο κωδικός σου για το Proteino
     Must keep {{ .Token }}: /verify-code asks for the 6-digit code, which
     works on any device (the link only works in the browser that asked). -->
<div style="font-family: 'Open Sans', Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #18181B;">
  <p style="font-size: 22px; font-weight: 700; margin: 0 0 16px;">proteino</p>
  <p style="font-size: 16px; line-height: 1.5; margin: 0 0 20px;">Γράψε αυτόν τον κωδικό στη σελίδα του Proteino για να ορίσεις νέο κωδικό πρόσβασης:</p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 8px; margin: 0 0 24px; padding: 16px; background: #F4F4F5; border-radius: 12px; text-align: center;">{{ .Token }}</p>
  <p style="font-size: 15px; line-height: 1.5; margin: 0 0 24px;">Ή, από αυτή τη συσκευή, πάτησε εδώ:</p>
  <p style="margin: 0 0 28px;"><a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #18181B; color: #FFFFFF; font-size: 15px; font-weight: 700; padding: 14px 22px; border-radius: 8px; text-decoration: none;">Όρισε νέο κωδικό</a></p>
  <p style="font-size: 13px; line-height: 1.5; color: #71717A; margin: 0;">Ο κωδικός λήγει σε 1 ώρα. Αν δεν το ζήτησες εσύ, αγνόησε αυτό το email. Ο λογαριασμός σου δεν αλλάζει.</p>
</div>
